run_id: mapfly_agent_gr00t_p1r0
run_root_dir: playground/Checkpoints
seed: 42
# Set WANDB_ENTITY to log under a team; otherwise W&B uses the logged-in user.
wandb_entity: null
wandb_project: starVLA_uav
is_debug: false
version_id: "0.21"

# The 12 seen scenes of the 15-scene dataset, OSM current_goal map, 80k steps.
# industrialcity / laketown / moderncity2 are not in the mix (unseen evaluation); the tail
# episodes of every seen scene are held out by the robot_type's slice (seen evaluation).
# Ablations have no yaml of their own: heads/variants.yaml records what each one changes
# here, and heads/variant_config.py composes it.

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2560        # Qwen3-VL-4B text hidden size; overrides cross_attention_dim
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024          # MLP width of state_encoder / action_decoder
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 4              # [forward, lateral, up, dyaw] per-step body-frame delta, min_max per dim
    state_dim: 4               # through state_encoder, unlike OFT's binned prompt tokens
    action_horizon: 8          # must equal len(action_indices) in data_config

    repeated_diffusion_steps: 8  # multiplies the DiT batch by 8; lower this first on OOM
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024         # must match action_decoder's input_dim
      cross_attention_dim: 2560
      positional_embeddings: null
  goal_head:              # stop + progress heads; need the uav_mapfly_goalgeo supervision columns
    hidden_dim: 512       # same as OFT, so the stop heads have equal capacity
    stop_radius_m: 8.0    # inside the 10 m closed-loop success radius; defined only here
    stop_pos_weight: 10.0 # positives are 5.6%; full balance would be ~17, kept lower to avoid early stops
    stop_bias_init: -2.8  # log(p/(1-p)) at p=0.056

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/uav
    data_mix: uav_mapfly_goalgeo_seen12_tau05
    action_type: delta_ee
    include_state: true          # state.pose relative to the episode start, start body frame
    sequential_step_sampling: false
    per_device_batch_size: 4     # 8 GPUs -> global batch 32; use 2 on OOM
    obs_image_size: [224, 224]
    load_all_data_for_training: true
    video_backend: torchvision_av
    # Same map conventions as the OFT main line, except where heading comes from: OFT puts
    # the binned state into the prompt and can say "use dyaw", while GR00T's state goes
    # through state_encoder into the DiT and never appears in the LLM's text, so heading is
    # inferred from the FPV and the north-up map. {instruction} stays last: Qwen pads on the
    # left and goal_head reads the last token, as for OFT.
    CoT_prompt: "Use both images. The top-down map is north-up and stays fixed; it does not rotate with you. The blue marker is your current position and the red marker is the goal. The map does not show heading; use the first-person view with this fixed north-up map to infer which way you are currently facing. Turn toward the goal, do not fly past it, and stop only when you are already next to it. Use the first-person view to keep the path ahead clear. {instruction}"

trainer:
  # 9660 episodes over 12 scenes after slicing. Pick the checkpoint among 40k/60k/80k on the
  # seen holdout rather than defaulting to the last step.
  max_train_steps: 80000
  num_warmup_steps: 4000         # 5% warmup
  save_interval: 10000           # 8 checkpoints, ~9.3 GB each
  eval_interval: 10000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05   # full VLM finetune
    action_model: 1.0e-04
    goal_head: 1.0e-04           # newly initialised head, not the base rate
  loss_weight:                   # same as OFT
    stop: 0.05
    progress: 0.5
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''             # full finetune
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
