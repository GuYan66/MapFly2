semantics:
  style: osm_carto
  building:
    actor_label_regex:
      - "^SM_NYCB_\\d+$"
  environment:
    component_rules:
      - {class: water, actor_label_regex: "^Sea$"}
      - {class: park, actor_label_regex: "^Landscape1$"}
      - {class: bridge, actor_label_regex: "^SM_Bridge_\\d+$"}
      - {class: road, actor_label_regex: "^Road_\\d+m_Box\\d*$"}
      - {class: road, actor_label_regex: "^Road_12m_L\\d*$"}
      - {class: road, actor_label_regex: "^Road_12m_T\\d*$"}
      - {class: road, actor_label_regex: "^Road_12m_24m_[LT]\\d*$"}
      - {class: road, actor_label_regex: "^Road_12m_enter\\d*$"}
      - {class: road, actor_label_regex: "^Road_24m_enter\\d*$"}
      - {class: residential_land, actor_label_regex: "^SM_Pavement_.+$"}
