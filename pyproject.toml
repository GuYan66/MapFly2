[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapfly"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "cosysairsim>=3.3,<3.4",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "rpc-msgpack>=0.6",
  "scipy>=1.11",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.12,<0.16",
]

[tool.setuptools.packages.find]
include = ["mapfly*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["refs", "starVLA"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
